<!DOCTYPE html>
<html lang="pt-br"  xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::main})}">
<head>
    <title>Javalanches - Cadastrar novo cliente</title>
</head>
<body>
    <main>
        <h1>Cadastrar novo cliente</h1><hr>
        <form method="POST">
          <div class="row">
            <div class="col-12 col-lg-4 mb-3">
                <label for="nomeCliente" class="form-label">Nome do cliente</label>
                <input type="text" class="form-control" id="nomeCliente" name="nomeCliente" required>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento" class="form-control" required>
            </div>
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Digite o CPF no formato 000.000.000-00" maxlength="14" class="form-control" required>
            </div> 
            <div class="col-12 mb-3">
                <label for="email" class="form-label">Digite seu email</label>
                <input type="email" id="email" name="email"  class="form-control" required>
            </div>
            <div class="col-12 mb-3">
            <label for="telefone" class="form-label">Digite seu Número</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999"  class="form-control" required>
            </div>
                <div class="row">

                <!-- CEP -->
                <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <label for="cep" class="form-label fw-bold">CEP</label>
                    <input type="text" id="cep" name="cep" class="form-control" placeholder="00000-000" required>
                </div>

                <!-- Logradouro -->
                <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <label for="logradouro" class="form-label fw-bold">Logradouro</label>
                    <input type="text" id="logradouro" name="logradouro" class="form-control" placeholder="Ex: Rua, Av." required>
                </div>

                <!-- Número -->
                <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <label for="numero" class="form-label fw-bold">Número</label>
                    <input type="text" id="numero" name="numero" class="form-control" placeholder="Ex: 123" required>
                </div>

                <!-- Complemento -->
                <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <label for="complemento" class="form-label fw-bold">Complemento</label>
                    <input type="text" id="complemento" name="complemento" class="form-control" placeholder="Ex: Ap 12, Bloco B">
                </div>

                <!-- Bairro -->
                <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <label for="bairro" class="form-label fw-bold">Bairro</label>
                    <input type="text" id="bairro" name="bairro" class="form-control" placeholder="Ex: Centro" required>
                </div>

                <!-- Cidade -->
                <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <label for="cidade" class="form-label fw-bold">Cidade</label>
                    <input type="text" id="cidade" name="cidade" class="form-control" placeholder="Ex: São Paulo" required>
                </div>

                <!-- Estado -->
                <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <label for="estado" class="form-label fw-bold">Estado (UF)</label>
                    <select id="estado" name="estado" class="form-select" required>
                        <option value="" disabled selected>Escolha...</option>
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AP">AP</option>
                        <option value="AM">AM</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MT">MT</option>
                        <option value="MS">MS</option>
                        <option value="MG">MG</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PR">PR</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RS">RS</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="SC">SC</option>
                        <option value="SP">SP</option>
                        <option value="SE">SE</option>
                        <option value="TO">TO</option>
                    </select>
                </div>

              <div class="d-flex justify-content-start">
                    <button type="submit" class="btn btn-primary">Cadastrar cliente</button>
                </div>
          </div>  
        </form>
         <script>
       const form = document.querySelector('form');
const maskCpf = document.querySelector('#cpf');
const maskTel = document.querySelector('#telefone');
const maskCep = document.querySelector('#cep');
const pesquisaCep = document.querySelector('#cep');

// máscaras de entrada
maskCpf.addEventListener('input', function() {
    this.value = this.value
        .replace(/\D/g, '')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
});

maskTel.addEventListener('input', function() {
    this.value = this.value
        .replace(/\D/g, '')
        .replace(/(\d{2})(\d)/, '($1) $2')
        .replace(/(\d{4,5})(\d)/, '$1-$2')
        .replace(/(\d{4})\d+?$/, '$1');
});

maskCep.addEventListener('input', function() {
    this.value = this.value
        .replace(/\D/g, '')
        .replace(/(\d{5})(\d)/, '$1-$2')
        .replace(/(-\d{3})\d+?$/, '$1');
});

// consumo da api
const limparFormularioCep = () => {
    document.querySelector('#estado').value = ('');
    document.querySelector('#cidade').value = ('');
    document.querySelector('#bairro').value = ('');
    document.querySelector('#logradouro').value = ('');
    document.querySelector('#complemento').value = ('');
}

const meuCallback = (conteudo) => {
    if (!("erro" in conteudo)) {
        document.querySelector('#estado').value = (conteudo.estado);
        document.querySelector('#cidade').value = (conteudo.localidade);
        document.querySelector('#bairro').value = (conteudo.bairro);
        document.querySelector('#logradouro').value = (conteudo.logradouro);
        document.querySelector('#complemento').value = (conteudo.complemento);
    }
    else {
        limparFormularioCep();
        alert("CEP não encontrado.");
    }
}

pesquisaCep.addEventListener('blur', function() {
    let cep = document.querySelector('#cep').value.replace(/\D/g, '');

    if (cep != '') {
        let validaCep = /^[0-9]{8}$/;

        if (validaCep.test(cep)) {
            document.querySelector('#estado').value = "buscando...";
            document.querySelector('#cidade').value = "buscando...";
            document.querySelector('#bairro').value = "buscando...";
            document.querySelector('#logradouro').value = "buscando...";
            document.querySelector('#complemento').value = "buscando...";

            let script = document.createElement('script');

            script.src = 'https://viacep.com.br/ws/' + cep + '/json/?callback=meuCallback';

            document.body.appendChild(script);
        }
        else {
            limparFormularioCep();
            alert("Formato do CEP inválido.");
        }
    }
    else {
        limparFormularioCep();
    }
});

// exibe os dados na página
form.addEventListener('submit', function(e) {
    e.preventDefault();

    let nome = document.querySelector('#nome').value;
    let email = document.querySelector('#email').value;
    let cpf = document.querySelector('#cpf').value;
    let telefone = document.querySelector('#telefone').value;
    let cep = document.querySelector('#cep').value;
    let estado = document.querySelector('#estado').value;
    let cidade = document.querySelector('#cidade').value;
    let bairro = document.querySelector('#bairro').value;
    let logradouro = document.querySelector('#logradouro').value;
    let numero = document.querySelector('#numero').value;
    let complemento = document.querySelector('#complemento').value;

    dados.innerHTML = `<b>Nome:</b> ${nome}<br>
        <b>E-mail:</b> ${email}<br>
        <b>CPF:</b> ${cpf}<br>
        <b>Telefone:</b> ${telefone}<br>
        <b>CEP:</b> ${cep}<br>
        <b>Estado:</b> ${estado}<br>
        <b>Cidade:</b> ${cidade}<br>
        <b>Bairro:</b> ${bairro}<br>
        <b>Logradouro:</b> ${logradouro}<br>
        <b>Número:</b> ${numero}<br>
        <b>Complemento:</b> ${complemento}`;

        form.reset();
});
    </script>
    </main>
</body>
</html>
