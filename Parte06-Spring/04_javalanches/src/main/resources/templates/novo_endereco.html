<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::title}, ~{::main})}">

<head>
    <title>Javalanches - Cadastrar novo endereço</title>
</head>

<body>

<main>

<h1>Cadastrar novo endereço</h1>
<hr>

<form method="POST">

<div class="row">
 
<!-- CEP -->
<div class="col-12 col-md-6 col-lg-4 mb-3">
<label for="cep">CEP</label>
<input type="text" id="cep" name="cep" class="form-control" maxlength="9" required>
</div>

<!-- LOGRADOURO -->
<div class="col-12 col-md-6 col-lg-4 mb-3">
<label for="logradouro">Logradouro</label>
<input type="text" id="logradouro" name="logradouro" class="form-control" required>
</div>

<!-- NÚMERO -->
<div class="col-12 col-md-6 col-lg-4 mb-3">
<label for="numero">Número</label>
<input type="text" id="numero" name="numero" class="form-control" required>
</div>

<!-- COMPLEMENTO -->
<div class="col-12 col-md-6 col-lg-4 mb-3">
<label for="complemento">Complemento</label>
<input type="text" id="complemento" name="complemento" class="form-control">
</div>

<!-- BAIRRO -->
<div class="col-12 col-md-6 col-lg-4 mb-3">
<label for="bairro">Bairro</label>
<input type="text" id="bairro" name="bairro" class="form-control" required>
</div>

<!-- CIDADE -->
<div class="col-12 col-md-6 col-lg-4 mb-3">
<label for="cidade">Cidade</label>
<input type="text" id="cidade" name="cidade" class="form-control" required>
</div>

<!-- UF -->
<div class="col-12 col-md-6 col-lg-4 mb-3">
<label for="uf">Estado (UF)</label>
<select id="uf" name="uf" class="form-select" required>
<option value="">Escolha...</option>
<option value="AC">AC</option>
<option value="AL">AL</option>
<option value="AP">AP</option>
<option value="AM">AM</option>
<option value="BA">BA</option>
<option value="CE">CE</option>
<option value="DF">DF</option>
<option value="ES">ES</option>
<option value="GO">GO</option>
<option value="MA">MA</option>
<option value="MT">MT</option>
<option value="MS">MS</option>
<option value="MG">MG</option>
<option value="PA">PA</option>
<option value="PB">PB</option>
<option value="PR">PR</option>
<option value="PE">PE</option>
<option value="PI">PI</option>
<option value="RJ">RJ</option>
<option value="RN">RN</option>
<option value="RS">RS</option>
<option value="RO">RO</option>
<option value="RR">RR</option>
<option value="SC">SC</option>
<option value="SP">SP</option>
<option value="SE">SE</option>
<option value="TO">TO</option>
</select>
</div>

<!-- BOTÃO -->
<div class="col-12 mt-3">
<button type="submit" class="btn btn-primary">
Cadastrar cliente
</button>
</div>

</div>

</form>

<script>

// CPF
document.getElementById('cpf').addEventListener('input', function () {
this.value = this.value
.replace(/\D/g, '')
.replace(/(\d{3})(\d)/, '$1.$2')
.replace(/(\d{3})(\d)/, '$1.$2')
.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
});

// TELEFONE
document.getElementById('telefone').addEventListener('input', function () {
this.value = this.value
.replace(/\D/g, '')
.replace(/(\d{2})(\d)/, '($1) $2')
.replace(/(\d{5})(\d)/, '$1-$2')
.substring(0, 15);
});

// CEP
document.getElementById('cep').addEventListener('blur', async function () {

const cep = this.value.replace(/\D/g, '');

if (cep.length !== 8) return;

try {

const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
const data = await r.json();

if (data.erro) return;

document.getElementById('uf').value = data.uf;
document.getElementById('cidade').value = data.localidade;
document.getElementById('bairro').value = data.bairro;
document.getElementById('logradouro').value = data.logradouro;

} catch (e) {
console.log(e);
}

});

</script>

</main>

</body>
</html>
